name: ANI-1xnr
year: 2024
category: Potential Fitting
license: CC BY 4.0
minimum_load_atoms_version: 0.3
description: |
    The ANI-1xnr dataset is the training dataset for the general reactive MLIP of the same name from: Exploring the frontiers of condensed-phase 
    chemistry with a general reactive machine learning potential (2024). Structures are sampled through active learning from 'nano-reactor' inspired MD simulations.
    Periodic cells containing randomly placed molecules (on average 139 atoms in total) of random compositions of C, H, N and O with less than three non-H atoms are used 
    to start MLIP driven MD simulations with randomised temperature and density to promote reactions and the formation of new products. 
    All structures from MD snapshots are labelled using the uBLYP-D3/TZV2P-GTH level of theory. Internally, files are downloaded from 
    `FigShare <https://springernature.figshare.com/articles/dataset/Exploring_the_frontiers_of_condensed-phase_chemistry_with_a_general_reactive_machine_learning_potential/22814579?file=43190004>`__.
citation: |
    @article{Zhang-24-03,
        title = {
            Exploring the frontiers of condensed-phase 
            chemistry with a general reactive machine learning potential
        },
        author = {
            Zhang, Shuhao and Makoś, Małgorzata Z. and Jadrich, Ryan B. and Kraka, 
            Elfi and Barros, Kipton and Nebgen, Benjamin T. and Tretiak, Sergei and Isayev, 
            Olexandr and Lubbers, Nicholas and Messerly, Richard A. and Smith, Justin S.
        },
        year = {2024},
        journal = {Nature Chemistry},
        volume = {16},
        number = {5},
        pages = {727-734},
        doi = {10.1038/s41557-023-01427-3},
    }

per_atom_properties:
    dft_forces:
        desc: force vectors (as labelled with uBLYP-D3/TZV2P-GTH)
        units: eV/Å
per_structure_properties:
    dft_energy:
        desc: energy of the structure (as labelled with uBLYP-D3/TZV2P-GTH)
        units: eV

representative_structure: 22_000
